name: CI
on: [push, pull_request]
jobs:

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Check out code into the Go module directory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup influxdb
        run: |
          source ./scripts/setup_influxdb.sh
          echo "INFLUXDB_V2_URL=$INFLUXDB_V2_URL" >> $GITHUB_ENV
          echo "INFLUXDB_V2_TOKEN=$INFLUXDB_V2_TOKEN" >> $GITHUB_ENV
          echo "INFLUXDB_V2_BUCKET_ID=$INFLUXDB_V2_BUCKET_ID" >> $GITHUB_ENV
          echo "INFLUXDB_V2_ORG_ID=$INFLUXDB_V2_ORG_ID" >> $GITHUB_ENV

      - name: Go fmt
        run: make fmt

      - name: Run unit tests
        run: make test

      - name: Run acceptance tests
        run: make testacc

      # Reachability-based, and it covers the Go standard library as well as
      # modules. That stdlib coverage is the point: this module sat on go 1.24.0
      # and carried 20+ reachable stdlib findings with nothing to report them.
      - name: Vulnerability scan
        run: |
          # govulncheck must be built with a toolchain at least as new as the
          # module's, or it refuses the analysis. `go install pkg@latest`
          # resolves govulncheck's own go directive, not ours, so pin it.
          GOTOOLCHAIN="go$(go env GOVERSION | sed 's/^go//')" \
            go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
